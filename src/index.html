<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>FocusDesk</title>
  <link rel="stylesheet" href="style.css">
  <script src="renderer.js" defer></script>
</head>
<body>
  <main>
    <header><span class="eyebrow">FOCUSDESK · TASKS</span><h1>Tasks</h1><p>Choose an Obsidian vault, then capture what you need to do.</p></header>
    <section class="panel" aria-label="Vault settings">
      <h2>Obsidian vault</h2>
      <p id="vault-label">Loading…</p>
      <button id="choose-vault" type="button">Choose vault folder</button>
      <div id="pending" role="status" hidden></div>
      <button id="retry" type="button" hidden>Retry pending events</button>
    </section>
    <section class="panel" aria-label="Task list">
      <h2>Your tasks</h2>
      <form id="task-form">
        <label for="task-title">Task title</label>
        <div class="entry"><input id="task-title" name="title" maxlength="200" placeholder="e.g. Read chapter 3" required><button id="add-task" type="submit">Add task</button></div>
      </form>
      <p id="message" role="status"></p>
      <ul id="tasks"></ul>
    </section>
    <section class="panel" id="focus" aria-label="Focus timer">
      <h2>Focus</h2>
      <form id="focus-settings" class="focus-settings">
        <label for="focus-minutes">Focus length (minutes, 1–180)</label>
        <input id="focus-minutes" type="number" min="1" max="180" step="1" required>
        <button type="submit">Save length</button>
      </form>
      <div id="focus-setup">
        <label for="focus-task">Choose a task</label>
        <select id="focus-task"><option value="">No task — use a description instead</option></select>
        <label for="focus-description">Or describe your activity</label>
        <input id="focus-description" maxlength="200" placeholder="e.g. Review lecture notes">
        <button id="focus-start" type="button" disabled>Start focus</button>
      </div>
      <div id="focus-active" hidden>
        <p id="focus-label"></p>
        <p id="focus-clock" aria-live="off">25:00</p>
        <p id="focus-status" role="status"></p>
        <div class="focus-actions">
          <button id="focus-pause" type="button">Pause</button>
          <button id="focus-resume" type="button" hidden>Resume</button>
          <button id="focus-extend" type="button">+5 minutes (once)</button>
          <button id="focus-finish" type="button">Finish early</button>
          <button id="focus-stop" type="button">Stop / Cancel</button>
        </div>
      </div>
      <p id="focus-message" role="status"></p>
      <h3>Completed focus sessions</h3>
      <ul id="focus-history"></ul>
    </section>
    <p class="footnote">Breaks and the day/week/month chart are planned for the next milestone. Completing focus does not complete its task.</p>
  </main>
</body>
</html>
